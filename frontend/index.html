<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Code Mail</title>
  <meta name="description" content="Seed Code Mail - local HTML email campaign manager">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="mail" data-size="20"></i></div>
        <div class="brand-text">
          <span class="brand-name">Seed Code Mail</span>
          <span class="brand-sub">Acquisition Outreach</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard"><i data-lucide="layout-dashboard" data-size="18"></i><span>Dashboard</span></a>
        <a class="nav-item" href="#/recipients" data-route="recipients"><i data-lucide="users" data-size="18"></i><span>Recipients</span></a>
        <a class="nav-item" href="#/campaigns" data-route="campaigns"><i data-lucide="send" data-size="18"></i><span>Campaigns</span></a>
        <a class="nav-item" href="#/templates" data-route="templates"><i data-lucide="layout-template" data-size="18"></i><span>Email Templates</span></a>
        <a class="nav-item" href="#/editor" data-route="editor"><i data-lucide="code" data-size="18"></i><span>Email Editor</span></a>
        <a class="nav-item" href="#/history" data-route="history"><i data-lucide="history" data-size="18"></i><span>Email History</span></a>
        <a class="nav-item" href="#/settings" data-route="settings"><i data-lucide="settings" data-size="18"></i><span>Settings</span></a>
      </nav>

      <div class="sidebar-footer">
        <span class="status-led" id="sidebar-led"></span>
        <span id="sidebar-status">Checking server…</span>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Toggle navigation"><i data-lucide="menu" data-size="20"></i></button>
        <div class="topbar-title">
          <h1 id="section-title">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="smtp-indicator" id="smtp-indicator" title="SMTP connection status">
            <span class="status-led"></span><span class="smtp-label">SMTP</span>
          </button>
          <button class="icon-btn" id="settings-shortcut" aria-label="Open settings" title="Settings"><i data-lucide="settings-2" data-size="18"></i></button>
          <div class="profile-chip" id="profile-chip" title="Sender identity">
            <span class="avatar" id="profile-avatar">?</span>
            <span class="profile-meta">
              <span class="profile-name" id="profile-name">Not configured</span>
              <span class="profile-email" id="profile-email">Open Settings</span>
            </span>
          </div>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
