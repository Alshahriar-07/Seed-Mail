<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Seed Code Mail</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8F8F6">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F8F8F6;
      color: #101010;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #E4E4DF;
      border-radius: 14px;
      padding: 40px 32px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 50%;
      border: 1px solid #E4E4DF;
      background: #F2F2EF;
      font-size: 26px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { margin: 0 0 20px; color: #5C5C57; font-size: 14px; line-height: 1.6; }
    code { background: #F2F2EF; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    a.btn {
      display: inline-block;
      text-decoration: none;
      background: #101010;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 8px;
    }
    a.btn:hover { background: #2C2C2A; }
  </style>
</head>
<body>
  <main class="card" role="alert">
    <div class="mark" aria-hidden="true">✳</div>
    <h1>404 — page not found</h1>
    <p>That page does not exist. The link may be out of date, or the address may
    have been mistyped.</p>
    <a class="btn" href="/">Back to Seed Code Mail</a>
  </main>
</body>
</html>
